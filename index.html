<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The AI Elevator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="in-landing">
  <div class="sky" aria-hidden="true"></div>

  <aside class="hud" aria-live="polite">
    <p class="hud-label">Productivity-o-Meter</p>
    <p id="altitude" class="hud-value">1x </p>
    <p id="layer" class="hud-sub">Lobby Layer</p>
    <div class="hud-stats">
      <p><span>Humans</span><strong id="hud-humans">x1</strong></p>
      <p><span>Velocity</span><strong id="hud-velocity">x1</strong></p>
      <p><span>Team</span><strong id="hud-team">Solo</strong></p>
      <p><span>Agents</span><strong id="hud-agents">x1</strong></p>
    </div>
  </aside>

  <main class="layout" id="experience-layout">
    <section class="tower-column" aria-label="Building map">
      <div class="tower-sticky">
        <h1>The AI Elevator</h1>
        <p id="tower-intro" class="intro"></p>

        <div class="tower" id="tower">
          <div class="tower-cap"></div>
          <ol id="tower-floors" class="tower-floors"></ol>
          <div id="car" class="car" aria-hidden="true"></div>
          <div class="tower-base"></div>
        </div>

        <p id="active-floor" class="active-floor">Ground Floor</p>
      </div>
    </section>

    <section id="stops" class="stops" aria-live="polite"></section>
  </main>

  <section id="landing" class="landing" aria-label="Welcome">
    <div class="landing-splash" aria-label="Landing page">
      <div class="splash-visual splash-visual-left" aria-hidden="true">
        <div class="retro-rig splash-retro">
          <div id="retro-screen" class="retro-screen"></div>
          <div class="retro-base"></div>
        </div>
      </div>

      <div class="splash-copy">
        <p class="splash-word splash-word-ai">AI</p>
        <p class="splash-word splash-word-elevator">Elevator</p>
        <p class="splash-scroll">
          <span class="splash-arrow" aria-hidden="true">↑</span>
          <span>Scroll Up</span>
          <span class="splash-arrow" aria-hidden="true">↑</span>
        </p>
      </div>

      <div class="splash-visual splash-visual-right" aria-hidden="true">
        <div id="pcb-scene" class="pcb-scene splash-pcb">
          <div class="trace trace-in"></div>
          <div class="trace trace-out"></div>
          <div class="trace-glow"></div>
          <div id="cpu-core" class="cpu-core">CPU</div>
          <div id="packet-lane" class="packet-lane"></div>
          <p class="pcb-caption">01001001 | MOV AX | JAVA DIVISION</p>
        </div>
      </div>
    </div>

    <div class="landing-card">
      <p id="landing-kicker" class="landing-kicker"></p>
      <h2 id="landing-title"></h2>
      <p id="landing-body"></p>
      <p id="landing-note" class="landing-note"></p>
    </div>
  </section>

  <a class="simonski-link" href="https://simonski.com" target="_blank" rel="noopener noreferrer">
    simonski.com
  </a>

  <script src="app.js"></script>
</body>
</html>
